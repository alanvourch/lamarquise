name: Mettre à jour les séances

on:
  schedule:
    # 9 h 17 et 15 h 17 UTC ≈ 5 h et 11 h à Montréal: before the day starts, then once more for late changes.
    - cron: '17 9,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Production address on Vercel: asset paths and link previews are built for it.
  SITE_URL: https://montreel.vercel.app
  VERCEL_PROJECT: montreel

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Keeps the TMDB matches, IMDb dump and last good showtimes between runs.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            web/public/data
          key: lamarquise-${{ github.run_id }}
          restore-keys: lamarquise-

      - name: Collecter les séances
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scraper/index.mjs

      - name: Construire le site
        working-directory: web
        env:
          BASE_PATH: /
        run: |
          npm ci
          npm run build

      # Static upload of web/dist; the project is created on the first run.
      - name: Publier sur Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN manquant (vercel.com/account/tokens, puis Settings → Secrets → Actions)."
            exit 1
          fi
          npx --yes vercel@65.2.0 deploy web/dist --prod --yes \
            --project "$VERCEL_PROJECT" --create-if-missing --token "$VERCEL_TOKEN"
