name: Mettre à jour les séances

# Collects the showtimes and commits web/public/data/showtimes.json; Vercel, linked to this
# repository, rebuilds and publishes the site on every push to main.
on:
  schedule:
    # 9 h 17 et 15 h 17 UTC ≈ 5 h et 11 h à Montréal: before the day starts, then once more for late changes.
    - cron: '17 9,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'web/public/data/**']

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keeps the TMDB matches and the IMDb dump between runs.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: lamarquise-${{ github.run_id }}
          restore-keys: lamarquise-

      - name: Collecter les séances
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scraper/index.mjs

      - name: Enregistrer les données
        run: |
          # Signed as the repository owner: Vercel's Hobby plan only deploys commits from the account owner.
          git config user.name "alanvourch"
          git config user.email "55190117+alanvourch@users.noreply.github.com"
          git add web/public/data/showtimes.json
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Séances du $(TZ=America/Toronto date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main
